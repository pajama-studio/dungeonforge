<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dungeonforge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>" />
  <style>
    html, body { margin: 0; height: 100%; background: #0a0e1c; overflow: hidden; }
    #app { position: fixed; inset: 0; }

    /* ---- top-left: identity ---- */
    #hud {
      position: fixed; top: 18px; left: 20px; color: #d8c9a3; z-index: 10;
      display: none;
      font-family: Georgia, 'Times New Roman', serif; user-select: none;
      text-shadow: 0 2px 8px rgba(0,0,0,.8);
    }
    #hud h1 {
      margin: 0; font-size: 13px; letter-spacing: .42em; font-weight: 400;
      color: #8f7f5c; text-transform: uppercase;
    }
    #hud .name { font-size: 20px; font-style: italic; margin: 5px 0 2px; color: #e8dcc0; }
    #hud .seed { font-size: 12px; color: #7d7460; letter-spacing: .08em; }

    /* ---- top-center: playable roguelike run ---- */
    #runHud {
      position: fixed; top: 16px; left: 50%; transform: translate(-50%, -12px);
      z-index: 12; min-width: 360px; padding: 9px 13px 10px;
      border: 1px solid rgba(112, 93, 62, .55); border-radius: 9px;
      background: rgba(9, 13, 25, .82); color: #d8c9a3;
      font: 12px Georgia, serif; letter-spacing: .06em;
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
      backdrop-filter: blur(5px); box-shadow: 0 6px 24px rgba(0,0,0,.3);
    }
    #runHud.show { opacity: 1; transform: translate(-50%, 0); }
    #runHud.dead { border-color: rgba(139, 47, 39, .75); }
    .runrow { display: flex; align-items: center; gap: 10px; }
    #runFloor { color: #f0d79f; min-width: 58px; text-transform: uppercase; }
    .hpbar { width: 138px; height: 7px; background: #251a1d; border: 1px solid #4a3033; border-radius: 4px; overflow: hidden; }
    #runHpFill { height: 100%; width: 100%; background: linear-gradient(90deg, #8f2f28, #d56a45); transition: width .16s; }
    #runHp { min-width: 58px; color: #cfa995; font-variant-numeric: tabular-nums; }
    #runAttack, #runShards { color: #cdb66f; }
    #runObjective { margin-top: 6px; text-align: center; font-size: 11px; color: #8f876f; }
    #runToast {
      position: fixed; top: 88px; left: 50%; z-index: 13;
      transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
      padding: 8px 15px; border-radius: 7px; background: rgba(13, 17, 30, .9);
      border: 1px solid rgba(140, 111, 60, .5); color: #f0d79f;
      font: 13px Georgia, serif; transition: opacity .18s, transform .18s;
    }
    #runToast.show { opacity: 1; transform: translate(-50%, 0); }
    #runToast span { margin-left: 9px; color: #9d9278; font-size: 11px; }
    #runReward {
      position: fixed; left: 50%; top: 50%; z-index: 15; width: min(680px, calc(100vw - 40px));
      transform: translate(-50%, -46%) scale(.97); opacity: 0; pointer-events: none;
      padding: 18px; border: 1px solid rgba(166, 132, 72, .62); border-radius: 12px;
      background: radial-gradient(circle at 50% 0, rgba(60, 45, 27, .94), rgba(8, 12, 23, .96) 58%);
      box-shadow: 0 24px 90px rgba(0,0,0,.65); color: #e8dcc0; font-family: Georgia, serif;
      transition: opacity .2s, transform .2s; backdrop-filter: blur(10px);
    }
    #runReward.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
    #runReward .eyebrow { color: #9c8658; text-align: center; font-size: 10px; letter-spacing: .35em; text-transform: uppercase; }
    #runReward h2 { margin: 6px 0 15px; text-align: center; font-size: 21px; font-weight: 400; font-style: italic; }
    #runRewardOptions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    #runRewardOptions button { min-height: 104px; padding: 13px 10px; border-color: rgba(126, 101, 61, .62); }
    #runRewardOptions strong, #runRewardOptions span { display: block; }
    #runRewardOptions strong { color: #f0d79f; font-size: 14px; margin-bottom: 8px; }
    #runRewardOptions span { color: #8f876f; font-size: 11px; line-height: 1.45; }
    #runRewardOptions em { display: block; margin-top: 7px; color: #665d4b; font-size: 9px; font-style: normal; }
    @media (max-width: 680px) { #runRewardOptions { grid-template-columns: 1fr; } #runRewardOptions button { min-height: 70px; } }

    /* ---- shared control look ---- */
    button, input {
      background: rgba(16, 20, 36, .78); color: #cdbf9d;
      border: 1px solid #33334c; border-radius: 7px;
      font-family: Georgia, serif; font-size: 13px; letter-spacing: .04em;
      outline: none;
    }
    button { cursor: pointer; padding: 8px 13px; transition: background .15s, color .15s, border-color .15s; }
    button:hover { background: rgba(46, 52, 82, .85); color: #ffe9b8; }
    button.active { background: rgba(122, 96, 52, .38); border-color: #8a744a; color: #ffe9b8; }

    /* ---- bottom-left: the WORLD — primary action, seed, mode switch ---- */
    #modes {
      position: fixed; bottom: 18px; left: 20px; z-index: 10;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    #btnNew { font-size: 14px; padding: 9px 16px; border-color: #4a4468; color: #e8dcc0; }
    #btnNew[aria-busy="true"] { border-color: #8a744a; color: #ffe9b8; }
    .seedbox { display: flex; }
    .seedbox input {
      width: 84px; padding: 8px 10px; border-radius: 7px 0 0 7px; border-right: none;
    }
    .seedbox button { border-radius: 0 7px 7px 0; }
    .segment { display: flex; }
    #modeSeg { display: none; }
    .segment button {
      border-radius: 0; border-right-width: 0; padding: 8px 12px; font-size: 12.5px;
    }
    .segment button:first-child { border-radius: 7px 0 0 7px; }
    .segment button:last-child { border-radius: 0 7px 7px 0; border-right-width: 1px; }

    /* ---- bottom-right: VIEW tools (toggles) ---- */
    #tools {
      position: fixed; bottom: 18px; right: 20px; z-index: 10;
      display: flex; gap: 8px;
    }
    #tools button {
      width: 42px; height: 38px; padding: 0; font-size: 17px; line-height: 1;
      display: grid; place-items: center;
    }
    #dragonGizmoPanel {
      position: fixed; right: 20px; bottom: 66px; z-index: 12;
      display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 11px;
      border: 1px solid rgba(138, 116, 74, .72); border-radius: 8px;
      background: rgba(9, 13, 25, .9); color: #cdbf9d;
      font: 11px Georgia, serif; letter-spacing: .045em;
      backdrop-filter: blur(6px); box-shadow: 0 5px 22px rgba(0,0,0,.3);
      opacity: 0; transform: translateY(5px); pointer-events: none;
      transition: opacity .16s, transform .16s;
    }
    #dragonGizmoPanel.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    #dragonGizmoReadout { min-width: 170px; color: #a9c1df; font-variant-numeric: tabular-nums; }
    #dragonGizmoPanel button { padding: 5px 8px; font-size: 10px; }
    body.dragon-gizmo #tip { bottom: 109px; color: #9b8760; }
    #app canvas.break-mode { cursor: crosshair; }

    /* ---- right: forge parameters (collapsible) ---- */
    #params {
      position: fixed; top: 18px; right: 20px; z-index: 11; width: 224px;
      background: rgba(14, 18, 34, .86); border: 1px solid #32324a; border-radius: 10px;
      padding: 12px 14px 14px; font-family: Georgia, serif; color: #b7a982;
      backdrop-filter: blur(4px);
      transition: transform .25s ease, opacity .25s ease;
      max-height: calc(100vh - 110px); overflow-y: auto;
    }
    #params.closed { transform: translateX(112%); opacity: 0; pointer-events: none; }
    #params .phead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    #params h2 {
      margin: 0; font-size: 11px; letter-spacing: .3em; font-weight: 400;
      color: #8f7f5c; text-transform: uppercase;
    }
    #params .phead button { padding: 2px 8px; font-size: 12px; border: none; background: none; color: #7d7460; }
    #params .phead button:hover { color: #ffe9b8; }
    #params h3 {
      margin: 12px 0 2px; font-size: 10.5px; letter-spacing: .22em; font-weight: 400;
      color: #6f6a58; text-transform: uppercase;
      border-bottom: 1px solid #26263c; padding-bottom: 4px;
    }
    #params label { display: block; font-size: 11.5px; margin: 7px 0 2px; letter-spacing: .06em; }
    #params label span { float: right; color: #e8dcc0; }
    #params input[type=range] {
      width: 100%; height: 4px; -webkit-appearance: none; appearance: none;
      background: #2c2c44; border-radius: 2px; outline: none; margin: 2px 0 0; border: none;
    }
    #params input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 11px; height: 11px;
      border-radius: 50%; background: #d8c9a3; border: 1px solid #6b5f45; cursor: pointer;
    }

    /* ---- left: dungeon editor drawer ---- */
    #editor {
      position: fixed; top: 18px; left: 20px; bottom: 74px; z-index: 12; width: 268px;
      display: flex; flex-direction: column;
      background: rgba(14, 18, 34, .9); border: 1px solid #32324a; border-radius: 10px;
      font-family: Georgia, serif; color: #b7a982;
      backdrop-filter: blur(6px); box-shadow: 0 18px 60px rgba(0,0,0,.5);
      transition: transform .25s ease, opacity .25s ease;
    }
    #editor.closed { transform: translateX(-112%); opacity: 0; pointer-events: none; }
    #editor header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 13px 9px; border-bottom: 1px solid #26263c;
    }
    #editor header strong {
      font-size: 11px; letter-spacing: .3em; font-weight: 400;
      color: #8f7f5c; text-transform: uppercase;
    }
    #editor .editor-close { padding: 2px 7px; border: none; background: none; color: #7d7460; }
    #editor .editor-close:hover { color: #ffe9b8; }
    .editor-tabs { display: flex; gap: 4px; padding: 8px 10px 0; }
    .editor-tabs button {
      flex: 1; padding: 6px 4px; font-size: 11px; letter-spacing: .08em;
      border-radius: 6px 6px 0 0; border-bottom-color: transparent;
    }
    .editor-tabs button.active { background: rgba(64, 54, 34, .6); color: #f0d79f; border-color: #6b5f45; }
    .editor-page { display: none; padding: 4px 13px 14px; overflow-y: auto; flex: 1; }
    .editor-page.show { display: block; }
    #editor h3 {
      margin: 13px 0 3px; font-size: 10.5px; letter-spacing: .22em; font-weight: 400;
      color: #6f6a58; text-transform: uppercase;
      border-bottom: 1px solid #26263c; padding-bottom: 4px;
    }
    .editor-empty { margin: 8px 0; font-size: 11px; line-height: 1.5; color: #6a6454; }
    .editor-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 7px; }
    .editor-tile {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 7px 2px 5px; border-radius: 7px; overflow: hidden;
    }
    .editor-tile .ico { font-size: 17px; line-height: 1.1; height: 22px; display: grid; place-items: center; }
    .editor-tile .ico img { width: 22px; height: 22px; image-rendering: auto; opacity: .92; }
    .editor-tile.brushing { border-color: #6b5f45; background: rgba(64, 54, 34, .7); }
    .editor-tile.brushing .cap { color: #f0d79f; }
    .editor-search {
      width: 100%; margin: 8px 0 2px; padding: 5px 8px; font-size: 11.5px;
    }
    .editor-brushbar {
      margin: 8px 0 4px; padding: 8px 9px; border: 1px solid #6b5f45; border-radius: 8px;
      background: rgba(64, 54, 34, .38); display: flex; flex-direction: column; gap: 7px;
    }
    .editor-brush-head { display: flex; align-items: center; gap: 8px; }
    .editor-brush-label { flex: 1; font-size: 11px; color: #f0d79f; letter-spacing: .04em; }
    .editor-brush-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .editor-brush-grid label {
      display: flex; align-items: center; justify-content: space-between; gap: 5px;
      margin: 0; font-size: 10px; color: #6f6a58;
    }
    .editor-brush-grid input { width: 3.4rem; min-width: 0; padding: 3px 5px; font-size: 11px; }
    .editor-tile .cap {
      font-size: 8px; letter-spacing: .02em; color: #7d7460; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    .editor-tile:hover { border-color: #6b5f45; background: rgba(64, 54, 34, .55); }
    .editor-tile:hover .cap { color: #e8dcc0; }
    .editor-subject {
      margin: 9px 0 0; font-size: 11px; color: #e8dcc0; letter-spacing: .04em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .editor-seg { display: flex; gap: 4px; margin: 9px 0 4px; }
    .editor-seg button { flex: 1; padding: 6px 2px; font-size: 10.5px; }
    .editor-seg button.active { background: rgba(64, 54, 34, .7); color: #f0d79f; border-color: #6b5f45; }
    .editor-check { display: flex; align-items: center; gap: 5px; font-size: 10.5px; margin: 0; white-space: nowrap; }
    .editor-opts { display: flex; align-items: center; gap: 10px; margin: 9px 0 2px; }
    .editor-mini { margin-left: auto; padding: 3px 8px; font-size: 10.5px; }
    .editor-array-row { display: grid; grid-template-columns: 3rem 3rem 1fr auto; gap: 4px; margin-top: 5px; }
    .editor-array-row input, .editor-array-row select {
      width: 100%; min-width: 0; padding: 4px 5px; font-size: 11px;
    }
    .editor-array-row select {
      background: rgba(16, 20, 36, .78); color: #cdbf9d;
      border: 1px solid #33334c; border-radius: 7px; font-family: Georgia, serif;
    }
    .editor-array-row button { padding: 4px 8px; font-size: 11px; }
    .editor-vec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 5px; }
    .editor-vec label { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #6f6a58; }
    .editor-vec input { width: 100%; min-width: 0; padding: 4px 5px; font-size: 11px; }
    .editor-actions { display: flex; gap: 5px; margin-top: 11px; }
    .editor-actions.wrap { flex-wrap: wrap; }
    .editor-actions button { flex: 1; min-width: 74px; padding: 7px 4px; font-size: 11px; }
    .editor-actions button.danger { color: #cf9a90; border-color: #5b3733; }
    .editor-actions button.danger:hover { background: rgba(90, 40, 34, .5); color: #ffd9cf; }
    .editor-wide { width: 100%; margin-top: 12px; padding: 8px; }
    .editor-outliner { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
    .editor-row { text-align: left; padding: 5px 8px; font-size: 11px; border-radius: 5px; }
    .editor-row.active { background: rgba(64, 54, 34, .7); color: #f0d79f; border-color: #6b5f45; }
    #editor label { display: block; font-size: 11.5px; margin: 7px 0 2px; letter-spacing: .06em; }
    #editor label span { float: right; color: #e8dcc0; }
    #editor input[type=range] {
      width: 100%; height: 4px; -webkit-appearance: none; appearance: none;
      background: #2c2c44; border-radius: 2px; outline: none; margin: 2px 0 0; border: none;
    }
    #editor input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 11px; height: 11px;
      border-radius: 50%; background: #d8c9a3; border: 1px solid #6b5f45; cursor: pointer;
    }
    body.editing #hud { display: none; }

    /* ---- camera shot list ---- */
    #shots {
      position: fixed; right: 20px; bottom: 74px; z-index: 12; width: 236px;
      max-height: calc(100vh - 160px); display: flex; flex-direction: column;
      background: rgba(14, 18, 34, .9); border: 1px solid #32324a; border-radius: 10px;
      font-family: Georgia, serif; color: #b7a982;
      backdrop-filter: blur(6px); box-shadow: 0 14px 44px rgba(0,0,0,.5);
      transition: transform .22s ease, opacity .22s ease;
    }
    #shots.closed { transform: translateY(12px); opacity: 0; pointer-events: none; }
    #shots header {
      display: flex; align-items: baseline; gap: 8px;
      padding: 10px 12px 8px; border-bottom: 1px solid #26263c;
    }
    #shots header strong {
      font-size: 10.5px; letter-spacing: .28em; font-weight: 400;
      color: #8f7f5c; text-transform: uppercase;
    }
    .shots-count { margin-left: auto; font: 11px monospace; color: #f0d79f; }
    .shots-actions { display: flex; gap: 5px; padding: 9px 12px 6px; }
    .shots-actions button { padding: 6px 8px; font-size: 11px; }
    .shots-capture { flex: 1; color: #f0d79f; border-color: #6b5f45; }
    .shots-actions .danger { color: #cf9a90; border-color: #5b3733; }
    .shots-list { overflow-y: auto; padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
    .shots-empty { margin: 8px 0; font-size: 11px; color: #6a6454; }
    .shots-row { display: grid; grid-template-columns: 1fr 4.4rem 1.4rem; gap: 4px; align-items: stretch; }
    .shots-go {
      display: flex; align-items: baseline; gap: 6px; text-align: left;
      padding: 5px 7px; font-size: 10px; overflow: hidden;
    }
    .shots-go b { color: #f0d79f; font-weight: 400; font-family: monospace; }
    .shots-go span {
      color: #6f6a58; font-family: monospace; font-size: 9px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .shots-note { min-width: 0; padding: 4px 5px; font-size: 10px; }
    .shots-del { padding: 4px; font-size: 10px; color: #8a6a64; }
    .shots-del:hover { color: #ffd9cf; border-color: #5b3733; }
    .shots-fallback { width: 100%; height: 90px; margin-top: 8px; font: 10px monospace; }

    #tip {
      position: fixed; bottom: 64px; right: 22px; z-index: 9;
      color: #5d5645; font: 11px Georgia, serif; letter-spacing: .1em;
      text-shadow: 0 1px 6px rgba(0,0,0,.8); text-align: right;
    }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0a0e1c; color: #8f7f5c; z-index: 20;
      font: italic 15px Georgia, serif; letter-spacing: .2em;
      transition: opacity .35s; pointer-events: none;
    }
    #loading span { animation: breathe 1.6s ease-in-out infinite; }
    #forgeSnapshot {
      position: fixed; inset: 0; z-index: 7; width: 100%; height: 100%;
      opacity: 0; pointer-events: none; transition: opacity .28s ease;
    }
    #forgeSnapshot.show { opacity: 1; }
    #forgeStatus {
      position: fixed; left: 20px; bottom: 69px; z-index: 11;
      min-width: 255px; max-width: min(440px, calc(100vw - 40px));
      padding: 8px 11px 9px; border: 1px solid rgba(74, 68, 104, .72);
      border-radius: 8px; background: rgba(9, 13, 25, .84); color: #9b927d;
      font: 11px Georgia, serif; letter-spacing: .055em; pointer-events: none;
      opacity: .84; transition: opacity .2s, border-color .2s, transform .2s;
      backdrop-filter: blur(6px); box-shadow: 0 5px 22px rgba(0,0,0,.26);
    }
    #forgeStatus.busy { opacity: 1; border-color: rgba(138, 116, 74, .78); transform: translateY(-2px); }
    #forgeStatus.failed { opacity: 1; border-color: rgba(139, 47, 39, .82); color: #d49b8d; }
    #forgeStatus.settled { opacity: 0; transform: translateY(5px); }
    #forgeStatus .forge-title { color: #d8c9a3; margin-bottom: 5px; }
    #forgeStatus .forge-meta { color: #726b5b; font-variant-numeric: tabular-nums; }
    #forgeStatus .forge-steps { display: flex; gap: 5px; margin-top: 7px; }
    #forgeStatus .forge-steps i { display: block; height: 2px; flex: 1; background: #28283d; border-radius: 2px; }
    #forgeStatus .forge-steps i.done { background: #806b45; }
    #forgeStatus .forge-steps i.active { background: #d3ae64; box-shadow: 0 0 7px rgba(211,174,100,.55); }
    #forgeStatus .forge-progress { height: 3px; margin-top: 7px; overflow: hidden; border-radius: 3px; background: #23263a; }
    #forgeStatus .forge-progress i {
      display: block; width: 100%; height: 100%; transform: scaleX(0); transform-origin: 0 50%;
      background: linear-gradient(90deg, #76613e, #d3ae64); box-shadow: 0 0 8px rgba(211,174,100,.42);
      transition: transform .16s linear; will-change: transform;
    }
    @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <canvas id="forgeSnapshot" aria-hidden="true"></canvas>

  <div id="hud">
    <h1>Dungeonforge</h1>
    <div class="name" id="dungeonName"></div>
    <div class="seed" id="seedLabel"></div>
  </div>

  <div id="runHud">
    <div class="runrow">
      <span id="runFloor">Depth 1</span>
      <div class="hpbar"><div id="runHpFill"></div></div>
      <span id="runHp">100 / 100</span>
      <span id="runAttack">⚔ 1</span>
      <span id="runShards">◆ 0</span>
    </div>
    <div id="runObjective">WASD move · Space attack · E interact</div>
  </div>
  <div id="runToast"></div>
  <div id="runReward" aria-hidden="true">
    <div class="eyebrow">Depth Cleansed</div>
    <h2>Bind one oath to this run</h2>
    <div id="runRewardOptions"></div>
  </div>

  <!-- the WORLD: primary action, seed, and the mode switch -->
  <div id="modes">
    <button id="btnNew">⚄ New dungeon</button>
    <div class="seedbox">
      <input id="seedInput" placeholder="seed…" inputmode="numeric" />
      <button id="btnGo">Forge</button>
    </div>
    <div class="segment" id="modeSeg">
      <button data-mode="chain" class="active" title="linked blocks grown like WFC tiles">Chain</button>
      <button data-mode="cube" title="27 blocks in a solid lattice">Cube</button>
      <button data-mode="ziggurat" title="terraces climbing to a summit sanctum">Ziggurat</button>
      <button data-mode="reliquary" title="a suspended diamond — sealed vault below, sanctum above">Reliquary</button>
      <button data-mode="endless" title="a streamed window that follows you">Endless ∞</button>
    </div>
  </div>

  <!-- the VIEW: overlays & demos (toggles) -->
  <div id="tools">
    <button id="btnPlay" title="roguelike descent — WASD / Shift dash / Space / E">⚔</button>
    <button id="btnCine" title="cinematic flythrough — any input exits">🎬</button>
    <button id="btnRoute" title="route: the grand tour across every block">🧭</button>
    <button id="btnNav" title="navmesh overlay — walkable / stairs / crossings">🕸</button>
    <button id="btnWalk" title="the skeleton walks the route (Esc stops)">💀</button>
    <button id="btnBreak" title="GPU destruction — click masonry (X)">💥</button>
    <button id="btnDragonGizmo" title="move dragon + rock landmark (G)">🐉</button>
    <button id="btnEditor" title="dungeon editor — assets, gizmo, generation (E)">🛠</button>
    <button id="btnShots" title="camera shots — capture framings (C)">📷</button>
    <button id="btnParams" title="forge parameters">⚙</button>
  </div>

  <div id="dragonGizmoPanel" aria-hidden="true">
    <span id="dragonGizmoReadout">Dragon + rock · X 0 · Y 0 · Z 0</span>
    <button id="btnDragonGizmoReset" title="restore generated placement">Reset</button>
  </div>

  <div id="params" class="closed">
    <div class="phead">
      <h2>Forge parameters</h2>
      <button id="btnParamsClose" title="close">✕</button>
    </div>
    <div id="params-body"></div>
  </div>

  <div id="tip">drag to orbit · scroll to zoom · Esc stops</div>
  <div id="forgeStatus" role="status" aria-live="polite">
    <div class="forge-title">Dungeon ready</div>
    <div class="forge-meta">waiting for a shuffle</div>
    <div class="forge-progress" role="progressbar" aria-label="Dungeon generation progress" aria-valuemin="0" aria-valuemax="100"><i></i></div>
    <div class="forge-steps"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="loading"><span>raising the old stones…</span></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
